plugins {
    id 'com.android.application'
}

android {
    namespace 'com.widi.orchestrator'
    compileSdk 34

    defaultConfig {
        applicationId 'com.widi.orchestrator'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // Kunci tetap agar pembaruan APK bisa dipasang di atas versi sebelumnya
        fixed {
            storeFile file('orchestrator-debug.jks')
            storePassword 'android'
            keyAlias 'orchestrator'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
